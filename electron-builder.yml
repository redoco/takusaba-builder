appId: com.github.reverinudog.takusababuilder
productName: 卓鯖ビルダー
publish:
  provider: github
  owner: redoco
  repo: takusaba-builder
directories:
  output: release
  buildResources: build-resources
files:
  - "build/**/*"
  - "web/dist/**/*"
  - "package.json"
  - "!**/*.map"
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build-resources/icon.png
  artifactName: TakusabaBuilder-Setup-${version}-${arch}.${ext}
appx:
  applicationId: TakusabaBuilder
  # Values from Partner Center > 卓鯖ビルダー > Product identity (Store ID 9N8TJVFFQFCM)
  identityName: kawaken.336635FC90E13
  publisher: CN=F9DB721D-4BB2-4721-A66D-1BCA13024325
  publisherDisplayName: kawaken
  displayName: 卓鯖ビルダー
  languages: [ja-JP, en-US, ko-KR, zh-Hans, zh-Hant]
  artifactName: TakusabaBuilder-${version}-store.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: 卓鯖ビルダー
  installerLanguages: [ja_JP]
  language: "1041"
mac:
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: build-resources/icon.png
  category: public.app-category.utilities
  identity: null
  hardenedRuntime: false
  artifactName: TakusabaBuilder-${version}-mac.${ext}
